<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startpage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: rgba(22, 25, 38, 0.65);
            --card-hover: rgba(35, 40, 60, 0.85);
            --search-bg: rgba(26, 29, 45, 0.85);
            --search-focus-bg: #161824;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.18);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px rgba(99, 102, 241, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            height: 100vh;
            width: 100vw;
            background: var(--bg-color);
            background-image: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0d0e15 70%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
            transition: background-image 0.5s ease-in-out;
        }

        .ambient-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.08), transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        .settings-trigger {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 50;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .settings-trigger:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            transform: rotate(45deg);
            border-color: var(--border-highlight);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .settings-trigger svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .focusable-element {
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        filter 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.focus-mode .focusable-element {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: scale(0.96);
            filter: blur(8px);
        }

        #clock {
            position: absolute;
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            color: #ffffff;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 10;
            user-select: none;
            direction: ltr;
        }

        .clock-top-left { top: 40px; left: 40px; transform: none; }
        .clock-top-center { top: 40px; left: 50%; transform: translateX(-50%); }
        .clock-top-right { top: 40px; right: 100px; transform: none; }
        .clock-center { top: 35%; left: 50%; transform: translate(-50%, -50%); }

        .search-wrapper {
            position: absolute;
            width: 90%;
            max-width: 620px;
            z-index: 30;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-pos-top-center { top: 160px; left: 50%; transform: translateX(-50%); }
        .search-pos-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }

        body.focus-mode .search-wrapper {
            top: 40% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1.02) !important;
        }

        .search-box {
            position: relative;
            width: 100%;
            background: var(--search-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            padding: 6px 18px;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            background: var(--search-focus-bg);
            border-color: var(--border-highlight);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }

        .search-icon-left {
            width: 22px;
            height: 22px;
            fill: var(--text-secondary);
            margin-left: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: fill 0.3s ease;
        }

        .search-box:focus-within .search-icon-left {
            fill: var(--accent-color);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 400;
            padding: 12px 0;
            width: 100%;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
            font-weight: 300;
        }

        .suggestions-card {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            background: var(--search-focus-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-highlight);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 40;
        }

        .suggestions-card.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
            gap: 14px;
            color: var(--text-primary);
            font-size: 0.98rem;
        }

        .suggestion-item:hover, .suggestion-item.selected {
            background: rgba(255, 255, 255, 0.08);
        }

        .suggestion-icon {
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
            flex-shrink: 0;
        }

        .suggestion-item:hover .suggestion-icon {
            fill: var(--text-primary);
        }

        .bookmarks-section {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 720px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            z-index: 20;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bm-pos-top { top: 220px; }
        .bm-pos-center { top: 66%; }
        .bm-pos-bottom { bottom: 50px; }

        .bookmark-card {
            position: relative;
            width: 96px;
            height: 96px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .bookmark-card:hover {
            background: var(--card-hover);
            border-color: var(--border-highlight);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .bookmark-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: contain;
        }

        .bookmark-title {
            font-size: 0.78rem;
            color: var(--text-primary);
            width: 80%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .bookmark-add-btn {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.02);
        }

        .bookmark-add-btn:hover {
            border-color: var(--accent-color);
            background: rgba(99, 102, 241, 0.1);
        }

        .bookmark-add-icon {
            width: 28px;
            height: 28px;
            fill: var(--text-secondary);
            transition: fill 0.3s ease;
        }

        .bookmark-add-btn:hover .bookmark-add-icon {
            fill: var(--accent-color);
        }

        .bookmark-delete {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ef4444;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .bookmark-card:hover .bookmark-delete {
            opacity: 1;
            transform: scale(1);
        }

        /* --- Modal & Settings Styles --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-body {
            background: #131522;
            border: 1px solid var(--border-highlight);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px;
            box-shadow: var(--shadow-lg);
            transform: scale(0.92) translateY(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-primary);
        }

        .modal-body::-webkit-scrollbar {
            width: 6px;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .modal-overlay.active .modal-body {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s ease;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.88rem;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        select.form-control {
            cursor: pointer;
        }

        select.form-control option {
            background: #131522;
            color: var(--text-primary);
        }

        /* Time Pattern Guide Box */
        .pattern-guide {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px;
            margin-top: 10px;
        }

        .pattern-guide-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .pattern-grid code {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            direction: ltr;
            display: inline-block;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: #4f46e5;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>

    <button class="settings-trigger focusable-element" onclick="openModal('settingsModal')" title="الإعدادات">
        <svg viewBox="0 0 24 24">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/>
        </svg>
    </button>

    <div id="clock" class="focusable-element clock-top-center">00:00:00</div>

    <div class="search-wrapper search-pos-center" id="searchWrapper">
        <div class="search-box">
            <div class="search-icon-left">
                <svg viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </div>
            <input type="text" class="search-input" id="searchInput" placeholder="ابحث في Google أو أدخل رابطاً..." autocomplete="off">
        </div>
        <div class="suggestions-card" id="suggestionsCard"></div>
    </div>

    <div class="bookmarks-section focusable-element bm-pos-bottom" id="bookmarksContainer"></div>

    <!-- Modal Settings -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-body">
            <div class="modal-header">
                <h3 class="modal-title">الإعدادات</h3>
                <button class="modal-close" onclick="closeModal('settingsModal')">&times;</button>
            </div>

            <div class="form-group">
                <label class="form-label">موقع الساعة:</label>
                <select class="form-control" id="clockPosSelect">
                    <option value="clock-top-left">أعلى اليسار</option>
                    <option value="clock-top-center">أعلى الوسط</option>
                    <option value="clock-top-right">أعلى اليمين</option>
                    <option value="clock-center">في المنتصف</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">موقع شريط البحث:</label>
                <select class="form-control" id="searchPosSelect">
                    <option value="search-pos-top-center">أعلى المنتصف</option>
                    <option value="search-pos-center">في المنتصف</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">موقع المفضلة:</label>
                <select class="form-control" id="bmPosSelect">
                    <option value="bm-pos-top">أعلى المنتصف</option>
                    <option value="bm-pos-center">المنتصف</option>
                    <option value="bm-pos-bottom">أسفل الشاشة</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">صيغة الوقت والتاريخ المخصصة:</label>
                <input type="text" class="form-control" id="customPatternInput" placeholder="HH:mm:ss" style="direction: ltr; text-align: left;">
                
                <div class="pattern-guide">
                    <div class="pattern-guide-title">دليل رموز صيغة الوقت:</div>
                    <div class="pattern-grid">
                        <div><code>HH</code> : ساعة (24)</div>
                        <div><code>hh</code> : ساعة (12)</div>
                        <div><code>mm</code> : دقائق</div>
                        <div><code>ss</code> : ثواني</div>
                        <div><code>A</code> : صباحاً/مساءً</div>
                        <div><code>dd</code> : اليوم</div>
                        <div><code>MM</code> : الشهر</div>
                        <div><code>yyyy</code> : السنة</div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">خلفية المظهر:</label>
                <input type="file" class="form-control" id="bgInput" accept="image/*">
            </div>

            <button class="btn-primary" onclick="saveCustomPattern()">حفظ وإغلاق</button>
        </div>
    </div>

    <!-- Modal Add Site -->
    <div class="modal-overlay" id="addSiteModal">
        <div class="modal-body">
            <div class="modal-header">
                <h3 class="modal-title">إضافة موقع مفضل</h3>
                <button class="modal-close" onclick="closeModal('addSiteModal')">&times;</button>
            </div>

            <div class="form-group">
                <label class="form-label">اسم الموقع:</label>
                <input type="text" class="form-control" id="siteNameInput" placeholder="مثال: Google">
            </div>

            <div class="form-group">
                <label class="form-label">الرابط (URL):</label>
                <input type="url" class="form-control" id="siteUrlInput" placeholder="https://www.example.com">
            </div>

            <button class="btn-primary" onclick="handleAddSite()">إضافة الموقع</button>
        </div>
    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // Custom Time Formatter
        function formatClock(now, pattern) {
            let hours24 = now.getHours();
            let hours12 = hours24 % 12 || 12;
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            let ampm = hours24 >= 12 ? 'PM' : 'AM';
            let day = String(now.getDate()).padStart(2, '0');
            let month = String(now.getMonth() + 1).padStart(2, '0');
            let year = now.getFullYear();

            return pattern
                .replace(/HH/g, String(hours24).padStart(2, '0'))
                .replace(/hh/g, String(hours12).padStart(2, '0'))
                .replace(/mm/g, minutes)
                .replace(/ss/g, seconds)
                .replace(/A/g, ampm)
                .replace(/dd/g, day)
                .replace(/MM/g, month)
                .replace(/yyyy/g, year);
        }

        const clockEl = document.getElementById('clock');
        function updateClock() {
            const now = new Date();
            const pattern = localStorage.getItem('timePattern') || 'HH:mm:ss';
            clockEl.innerText = formatClock(now, pattern);
        }
        setInterval(updateClock, 1000);
        updateClock();

        function saveCustomPattern() {
            const val = document.getElementById('customPatternInput').value.trim();
            if (val) {
                localStorage.setItem('timePattern', val);
            }
            updateClock();
            closeModal('settingsModal');
        }

        document.getElementById('customPatternInput').value = localStorage.getItem('timePattern') || 'HH:mm:ss';

        // Settings Change Handlers
        document.getElementById('clockPosSelect').addEventListener('change', (e) => {
            clockEl.className = 'focusable-element ' + e.target.value;
            localStorage.setItem('clockPos', e.target.value);
        });

        const searchWrapper = document.getElementById('searchWrapper');
        document.getElementById('searchPosSelect').addEventListener('change', (e) => {
            searchWrapper.className = 'search-wrapper ' + e.target.value;
            localStorage.setItem('searchPos', e.target.value);
        });

        const bookmarksContainer = document.getElementById('bookmarksContainer');
        document.getElementById('bmPosSelect').addEventListener('change', (e) => {
            bookmarksContainer.className = 'bookmarks-section focusable-element ' + e.target.value;
            localStorage.setItem('bmPos', e.target.value);
        });

        document.getElementById('bgInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const bgUrl = event.target.result;
                    document.body.style.backgroundImage = `url('${bgUrl}')`;
                    localStorage.setItem('customBg', bgUrl);
                };
                reader.readAsDataURL(file);
            }
        });

        // Load Saved Positions & Background
        const savedClockPos = localStorage.getItem('clockPos') || 'clock-top-center';
        const savedSearchPos = localStorage.getItem('searchPos') || 'search-pos-center';
        const savedBmPos = localStorage.getItem('bmPos') || 'bm-pos-bottom';

        clockEl.className = 'focusable-element ' + savedClockPos;
        searchWrapper.className = 'search-wrapper ' + savedSearchPos;
        bookmarksContainer.className = 'bookmarks-section focusable-element ' + savedBmPos;

        document.getElementById('clockPosSelect').value = savedClockPos;
        document.getElementById('searchPosSelect').value = savedSearchPos;
        document.getElementById('bmPosSelect').value = savedBmPos;

        const savedBg = localStorage.getItem('customBg');
        if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;

        // Search Focus & Suggestions
        const searchInput = document.getElementById('searchInput');
        const suggestionsCard = document.getElementById('suggestionsCard');

        searchInput.addEventListener('focus', () => {
            document.body.classList.add('focus-mode');
        });

        document.addEventListener('click', (e) => {
            if (!searchWrapper.contains(e.target)) {
                document.body.classList.remove('focus-mode');
                suggestionsCard.classList.remove('active');
            }
        });

        window.handleGoogleSuggestions = function(data) {
            const suggestions = data[1] || [];
            if (suggestions.length === 0 || !document.body.classList.contains('focus-mode')) {
                suggestionsCard.classList.remove('active');
                return;
            }

            suggestionsCard.innerHTML = suggestions.slice(0, 5).map(item => `
                <div class="suggestion-item" onclick="executeSearch('${item[0]}')">
                    <svg class="suggestion-icon" viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <span>${item[0]}</span>
                </div>
            `).join('');

            suggestionsCard.classList.add('active');
        };

        let currentScript = null;
        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            if (!query) {
                suggestionsCard.classList.remove('active');
                return;
            }

            if (currentScript) {
                document.body.removeChild(currentScript);
            }

            currentScript = document.createElement('script');
            currentScript.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&jsonp=handleGoogleSuggestions`;
            document.body.appendChild(currentScript);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') executeSearch(searchInput.value);
        });

        function executeSearch(query) {
            if (!query.trim()) return;
            if (query.startsWith('http://') || query.startsWith('https://')) {
                window.location.href = query;
            } else if (query.includes('.') && !query.includes(' ')) {
                window.location.href = 'https://' + query;
            } else {
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }
        }

        // Bookmarks Logic
        const defaultBookmarks = [
            { name: 'Google', url: 'https://www.google.com' },
            { name: 'YouTube', url: 'https://www.youtube.com' },
            { name: 'GitHub', url: 'https://www.github.com' }
        ];

        function getBookmarks() {
            const stored = localStorage.getItem('userBookmarks');
            return stored ? JSON.parse(stored) : defaultBookmarks;
        }

        function renderBookmarks() {
            const list = getBookmarks();
            let html = list.map((item, index) => {
                let domain = '';
                try { domain = new URL(item.url).hostname; } catch(e) { domain = item.url; }
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

                return `
                    <div class="bookmark-card" onclick="window.location.href='${item.url}'">
                        <button class="bookmark-delete" onclick="event.stopPropagation(); deleteBookmark(${index});" title="حذف">&times;</button>
                        <img class="bookmark-icon" src="${faviconUrl}" onerror="this.src='https://placehold.co/32x32/1a1d2d/ffffff?text=${item.name[0]}'" alt="${item.name}">
                        <span class="bookmark-title">${item.name}</span>
                    </div>
                `;
            }).join('');

            html += `
                <div class="bookmark-card bookmark-add-btn" onclick="openModal('addSiteModal')">
                    <svg class="bookmark-add-icon" viewBox="0 0 24 24">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    <span class="bookmark-title" style="color: var(--text-secondary);">إضافة موقع</span>
                </div>
            `;

            bookmarksContainer.innerHTML = html;
        }

        function handleAddSite() {
            const name = document.getElementById('siteNameInput').value.trim();
            let url = document.getElementById('siteUrlInput').value.trim();

            if (!name || !url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const list = getBookmarks();
            list.push({ name, url });
            localStorage.setItem('userBookmarks', JSON.stringify(list));

            document.getElementById('siteNameInput').value = '';
            document.getElementById('siteUrlInput').value = '';
            closeModal('addSiteModal');
            renderBookmarks();
        }

        function deleteBookmark(index) {
            const list = getBookmarks();
            list.splice(index, 1);
            localStorage.setItem('userBookmarks', JSON.stringify(list));
            renderBookmarks();
        }

        renderBookmarks();
    </script>
</body>
</html>
