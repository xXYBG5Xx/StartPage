<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startpage - صفحة البداية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f3ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Vazirmatn -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        background-color 0.3s ease,
                        border-color 0.3s ease;
        }

        /* Default Dark Gradient Background from image */
        .bg-custom-gradient {
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
        }
        .light .bg-custom-gradient {
            background: radial-gradient(circle at center, #f1f5f9 0%, #e2e8f0 100%);
        }

        /* Focus Dimming Effect */
        body.search-focused .dimmable-element {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: scale(0.96) translateY(8px);
            filter: blur(4px);
        }

        /* Search input glowing effect */
        .search-glow:focus-within {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.35);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }
    </style>
</head>
<body id="mainBody" class="min-h-screen w-full relative overflow-x-hidden bg-custom-gradient text-slate-100 dark:text-slate-100 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Top Settings Bar -->
    <header class="fixed top-0 left-0 right-0 p-4 z-40 flex justify-between items-center pointer-events-none">
        <div class="flex items-center gap-2 pointer-events-auto">
            <!-- Dynamic Widgets placement wrapper will handle positioning -->
        </div>
        
        <!-- Settings Gear Button -->
        <button id="openSettingsBtn" onclick="toggleModal('settingsModal', true)" 
                class="dimmable-element pointer-events-auto p-3 rounded-2xl bg-slate-900/40 hover:bg-slate-800/60 dark:bg-slate-800/40 dark:hover:bg-slate-700/60 backdrop-blur-md border border-white/10 text-slate-200 shadow-lg hover:scale-110 active:scale-95 transition-all cursor-pointer"
                title="الإعدادات">
            <i data-lucide="settings" class="w-6 h-6"></i>
        </button>
    </header>

    <!-- Clock & Date Floating Container -->
    <div id="clockContainer" class="dimmable-element absolute z-20 flex flex-col items-center justify-center transition-all duration-500">
        <div id="clockTime" class="font-bold tracking-tight text-slate-100 dark:text-slate-100 drop-shadow-md"></div>
        <div id="clockDate" class="text-slate-300 dark:text-slate-300 font-medium drop-shadow opacity-90"></div>
    </div>

    <!-- Search Bar Wrapper -->
    <main id="searchWrapper" class="absolute z-30 w-full max-w-2xl px-4 transition-all duration-500 left-1/2 -translate-x-1/2">
        <form id="searchForm" onsubmit="handleSearch(event)" class="w-full">
            <div class="relative search-glow rounded-full bg-slate-900/60 dark:bg-slate-900/70 border border-white/15 dark:border-white/10 backdrop-blur-xl shadow-2xl transition-all duration-300">
                <input type="text" id="searchInput" 
                       placeholder="ابحث أو أدخل رابطاً..." 
                       autocomplete="off"
                       class="w-full py-4 pr-6 pl-14 text-lg bg-transparent text-white placeholder-slate-400 dark:placeholder-slate-400 rounded-full focus:outline-none"
                       onfocus="setSearchFocus(true)"
                       onblur="setSearchFocus(false)">
                <button type="submit" class="absolute left-3 top-1/2 -translate-y-1/2 p-2.5 rounded-full text-indigo-400 hover:text-indigo-300 hover:bg-white/5 transition-all">
                    <i data-lucide="search" class="w-6 h-6"></i>
                </button>
            </div>
        </form>
    </main>

    <!-- Shortcuts / Favorites Container -->
    <div id="shortcutsContainer" class="dimmable-element absolute z-20 left-1/2 -translate-x-1/2 transition-all duration-500 w-full max-w-4xl px-4 flex flex-wrap justify-center gap-4">
        <!-- Rendered dynamically -->
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-900/90 border border-white/10 w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] text-slate-100">
            <!-- Modal Header -->
            <div class="p-6 border-b border-white/10 flex justify-between items-center bg-white/5">
                <div class="flex items-center gap-3">
                    <i data-lucide="sliders" class="w-6 h-6 text-indigo-400"></i>
                    <h2 class="text-xl font-bold">إعدادات الصفحة</h2>
                </div>
                <button onclick="toggleModal('settingsModal', false)" class="p-2 rounded-xl hover:bg-white/10 text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Modal Body (Scrollable) -->
            <div class="p-6 overflow-y-auto space-y-6">
                
                <!-- Search Engine Selection -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-300">محرك البحث الافتراضي</label>
                    <select id="settingEngine" onchange="updateSettings()" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
                        <option value="https://www.google.com/search?q=">Google</option>
                        <option value="https://www.bing.com/search?q=">Bing</option>
                        <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
                        <option value="https://search.brave.com/search?q=">Brave</option>
                    </select>
                </div>

                <!-- Clock & Date Controls -->
                <div class="p-4 bg-white/5 rounded-2xl space-y-4 border border-white/5">
                    <h3 class="text-md font-bold text-indigo-400 flex items-center gap-2">
                        <i data-lucide="clock" class="w-5 h-5"></i>
                        الوقت والتاريخ
                    </h3>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- System Format -->
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">تنسيق الوقت (نظام)</label>
                            <select id="settingClockSystem" onchange="updateSettings()" class="w-full bg-slate-800 border border-white/10 rounded-xl p-2.5 text-sm text-white focus:outline-none">
                                <option value="12">12 ساعة</option>
                                <option value="24">24 ساعة</option>
                            </select>
                        </div>

                        <!-- Clock Location -->
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">موقع الوقت والتاريخ</label>
                            <select id="settingClockPos" onchange="updateSettings()" class="w-full bg-slate-800 border border-white/10 rounded-xl p-2.5 text-sm text-white focus:outline-none">
                                <option value="top-center">أعلى المنتصف</option>
                                <option value="center">المنتصف</option>
                                <option value="top-right">أعلى اليمين</option>
                                <option value="top-left">أعلى اليسار</option>
                            </select>
                        </div>

                        <!-- Date Windows Format -->
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">تنسيق التاريخ (رموز ويندوز)</label>
                            <select id="settingDateFormat" onchange="updateSettings()" class="w-full bg-slate-800 border border-white/10 rounded-xl p-2.5 text-sm text-white focus:outline-none">
                                <option value="dd - MM - yyyy">dd - MM - yyyy</option>
                                <option value="dddd, MMMM d, yyyy">dddd, MMMM d, yyyy</option>
                                <option value="yyyy/MM/dd">yyyy/MM/dd</option>
                            </select>
                        </div>

                        <!-- Time Windows Format -->
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">تنسيق الوقت (رموز ويندوز)</label>
                            <select id="settingTimeFormat" onchange="updateSettings()" class="w-full bg-slate-800 border border-white/10 rounded-xl p-2.5 text-sm text-white focus:outline-none">
                                <option value="h:mm tt">h:mm tt</option>
                                <option value="h:mm:ss tt">h:mm:ss tt</option>
                                <option value="HH:mm">HH:mm</option>
                                <option value="HH:mm:ss">HH:mm:ss</option>
                            </select>
                        </div>
                    </div>

                    <!-- Visibility Options -->
                    <div class="flex flex-wrap gap-4 pt-2">
                        <label class="flex items-center gap-2 cursor-pointer text-sm">
                            <input type="checkbox" id="settingShowClock" onchange="updateSettings()" class="rounded border-white/20 bg-slate-800 text-indigo-600 focus:ring-0">
                            إظهار الوقت
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm">
                            <input type="checkbox" id="settingShowDate" onchange="updateSettings()" class="rounded border-white/20 bg-slate-800 text-indigo-600 focus:ring-0">
                            إظهار التاريخ
                        </label>
                    </div>

                    <!-- Format Guide Explanation Box -->
                    <div class="p-3 bg-indigo-950/40 border border-indigo-500/20 rounded-xl text-xs text-indigo-200/80 space-y-1">
                        <span class="font-bold text-indigo-300 block mb-1">دليل رموز التنسيق القياسية:</span>
                        <div class="grid grid-cols-2 gap-x-4 gap-y-1">
                            <div><code class="text-indigo-400">h</code> : ساعات (1-12)</div>
                            <div><code class="text-indigo-400">HH</code> : ساعات (00-23)</div>
                            <div><code class="text-indigo-400">mm</code> : دقائق</div>
                            <div><code class="text-indigo-400">ss</code> : ثوانٍ</div>
                            <div><code class="text-indigo-400">tt</code> : AM/PM</div>
                            <div><code class="text-indigo-400">d/dd</code> : اليوم برقم/برقمين</div>
                            <div><code class="text-indigo-400">dddd</code> : اسم اليوم</div>
                            <div><code class="text-indigo-400">MM/MMMM</code> : الشهر رقم/اسم</div>
                            <div><code class="text-indigo-400">yyyy</code> : السنة كاملة</div>
                        </div>
                    </div>
                </div>

                <!-- Custom Background -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-300">خلفية مخصصة من الجهاز</label>
                    <div class="flex gap-2">
                        <input type="file" id="bgFileInput" accept="image/*" class="hidden" onchange="handleBgUpload(event)">
                        <button onclick="document.getElementById('bgFileInput').click()" class="flex-1 bg-slate-800 border border-white/10 rounded-xl px-4 py-2.5 text-sm hover:bg-slate-700 transition flex items-center justify-center gap-2">
                            <i data-lucide="image" class="w-4 h-4"></i>
                            اختر صورة...
                        </button>
                        <button id="removeBgBtn" onclick="removeBackground()" class="hidden bg-rose-500/20 text-rose-300 border border-rose-500/30 rounded-xl px-4 py-2.5 text-sm hover:bg-rose-500/30 transition">
                            إزالة
                        </button>
                    </div>
                </div>

                <!-- Search Bar Position -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-300">موقع شريط البحث</label>
                    <select id="settingSearchPos" onchange="updateSettings()" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none">
                        <option value="center">المنتصف</option>
                        <option value="top">أعلى المنتصف</option>
                    </select>
                </div>

                <!-- Shortcuts Settings -->
                <div class="p-4 bg-white/5 rounded-2xl space-y-4 border border-white/5">
                    <h3 class="text-md font-bold text-indigo-400 flex items-center gap-2">
                        <i data-lucide="bookmark" class="w-5 h-5"></i>
                        الصفحات المفضلة
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">الموقع</label>
                            <select id="settingShortcutsPos" onchange="updateSettings()" class="w-full bg-slate-800 border border-white/10 rounded-xl p-2.5 text-sm text-white focus:outline-none">
                                <option value="bottom">منتصف أسفل</option>
                                <option value="center">منتصف</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">الحجم</label>
                            <select id="settingShortcutsSize" onchange="updateSettings()" class="w-full bg-slate-800 border border-white/10 rounded-xl p-2.5 text-sm text-white focus:outline-none">
                                <option value="sm">صغير</option>
                                <option value="md">متوسط</option>
                                <option value="lg">كبير</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Theme / Appearance Mode -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-300">المظهر</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="setTheme('dark')" id="themeDarkBtn" class="p-3 rounded-xl border border-white/10 flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700">
                            <i data-lucide="moon" class="w-4 h-4"></i>
                            داكن (Dark)
                        </button>
                        <button onclick="setTheme('light')" id="themeLightBtn" class="p-3 rounded-xl border border-white/10 flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700">
                            <i data-lucide="sun" class="w-4 h-4"></i>
                            مضيء (Light)
                        </button>
                    </div>
                </div>

                <!-- Backup & Restore -->
                <div class="pt-4 border-t border-white/10 flex flex-wrap gap-3">
                    <button onclick="exportData()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-white/10 rounded-xl p-3 text-xs font-semibold flex items-center justify-center gap-2">
                        <i data-lucide="download" class="w-4 h-4 text-emerald-400"></i>
                        تصدير النسخة الاحتياطية
                    </button>
                    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
                    <button onclick="document.getElementById('importFileInput').click()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-white/10 rounded-xl p-3 text-xs font-semibold flex items-center justify-center gap-2">
                        <i data-lucide="upload" class="w-4 h-4 text-amber-400"></i>
                        استيراد نسخة احتياطية
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Add Favorite Shortcut Modal -->
    <div id="addShortcutModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-900 border border-white/10 w-full max-w-md rounded-3xl p-6 shadow-2xl text-slate-100 space-y-4">
            <h3 class="text-lg font-bold">إضافة موقع جديد</h3>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">عنوان الموقع</label>
                <input type="text" id="shortcutTitle" placeholder="مثال: GitHub" class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 text-white">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">رابط الموقع (URL)</label>
                <input type="url" id="shortcutUrl" placeholder="https://example.com" class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 text-white">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="toggleModal('addShortcutModal', false)" class="px-4 py-2 rounded-xl hover:bg-white/10 text-slate-400 text-sm">إلغاء</button>
                <button onclick="saveShortcut()" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold">إضافة</button>
            </div>
        </div>
    </div>

    <script>
        // Default Default Data & Configuration
        const DEFAULT_SHORTCUTS = [
            { title: 'Google', url: 'https://google.com', icon: 'https://www.google.com/favicon.ico' },
            { title: 'YouTube', url: 'https://youtube.com', icon: 'https://www.youtube.com/favicon.ico' },
            { title: 'GitHub', url: 'https://github.com', icon: 'https://github.githubassets.com/favicons/favicon.png' }
        ];

        const DEFAULT_SETTINGS = {
            searchEngine: 'https://www.google.com/search?q=',
            clockSystem: '12',
            clockPos: 'top-center',
            timeFormat: 'h:mm tt',
            dateFormat: 'dd - MM - yyyy',
            showClock: true,
            showDate: true,
            bgImage: '',
            searchPos: 'center',
            shortcutsPos: 'bottom',
            shortcutsSize: 'md',
            theme: 'dark'
        };

        let state = {
            settings: { ...DEFAULT_SETTINGS },
            shortcuts: [...DEFAULT_SHORTCUTS]
        };

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            initLucide();
            startClock();
            applyState();
        });

        function initLucide() {
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        // Load saved state from LocalStorage
        function loadState() {
            const savedSettings = localStorage.getItem('sp_settings');
            if (savedSettings) {
                try { state.settings = { ...DEFAULT_SETTINGS, ...JSON.parse(savedSettings) }; } catch(e){}
            }
            const savedShortcuts = localStorage.getItem('sp_shortcuts');
            if (savedShortcuts) {
                try { state.shortcuts = JSON.parse(savedShortcuts); } catch(e){}
            }
        }

        function saveState() {
            localStorage.setItem('sp_settings', JSON.stringify(state.settings));
            localStorage.setItem('sp_shortcuts', JSON.stringify(state.shortcuts));
        }

        // Apply visual states based on configuration
        function applyState() {
            const { settings } = state;

            // Apply Theme
            if (settings.theme === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
            } else {
                document.documentElement.classList.remove('light');
                document.documentElement.classList.add('dark');
            }

            // Apply Background
            const body = document.getElementById('mainBody');
            const removeBtn = document.getElementById('removeBgBtn');
            if (settings.bgImage) {
                body.style.backgroundImage = `url('${settings.bgImage}')`;
                body.style.backgroundSize = 'cover';
                body.style.backgroundPosition = 'center';
                removeBtn.classList.remove('hidden');
            } else {
                body.style.backgroundImage = '';
                removeBtn.classList.add('hidden');
            }

            // Apply Clock Visibility & Positioning
            const clockContainer = document.getElementById('clockContainer');
            clockContainer.style.display = (settings.showClock || settings.showDate) ? 'flex' : 'none';

            // Clock Positions
            clockContainer.className = 'dimmable-element absolute z-20 flex flex-col items-center justify-center transition-all duration-500';
            switch (settings.clockPos) {
                case 'top-center':
                    clockContainer.style.top = '10%';
                    clockContainer.style.left = '50%';
                    clockContainer.style.transform = 'translateX(-50%)';
                    break;
                case 'center':
                    clockContainer.style.top = '35%';
                    clockContainer.style.left = '50%';
                    clockContainer.style.transform = 'translate(-50%, -50%)';
                    break;
                case 'top-right':
                    clockContainer.style.top = '5%';
                    clockContainer.style.right = '5%';
                    clockContainer.style.left = 'auto';
                    clockContainer.style.transform = 'none';
                    break;
                case 'top-left':
                    clockContainer.style.top = '5%';
                    clockContainer.style.left = '5%';
                    clockContainer.style.right = 'auto';
                    clockContainer.style.transform = 'none';
                    break;
            }

            // Search Bar Positioning
            const searchWrapper = document.getElementById('searchWrapper');
            if (settings.searchPos === 'center') {
                searchWrapper.style.top = '50%';
                searchWrapper.style.transform = 'translate(-50%, -50%)';
            } else {
                searchWrapper.style.top = '28%';
                searchWrapper.style.transform = 'translateX(-50%)';
            }

            // Shortcuts Placement & Size
            renderShortcuts();

            // Modal Input Binding
            document.getElementById('settingEngine').value = settings.searchEngine;
            document.getElementById('settingClockSystem').value = settings.clockSystem;
            document.getElementById('settingClockPos').value = settings.clockPos;
            document.getElementById('settingDateFormat').value = settings.dateFormat;
            document.getElementById('settingTimeFormat').value = settings.timeFormat;
            document.getElementById('settingShowClock').checked = settings.showClock;
            document.getElementById('settingShowDate').checked = settings.showDate;
            document.getElementById('settingSearchPos').value = settings.searchPos;
            document.getElementById('settingShortcutsPos').value = settings.shortcutsPos;
            document.getElementById('settingShortcutsSize').value = settings.shortcutsSize;

            updateClock();
        }

        // Render Shortcuts List
        function renderShortcuts() {
            const container = document.getElementById('shortcutsContainer');
            const { shortcutsPos, shortcutsSize } = state.settings;

            // Positioning
            if (shortcutsPos === 'bottom') {
                container.style.top = 'auto';
                container.style.bottom = '12%';
            } else {
                container.style.top = '68%';
                container.style.bottom = 'auto';
            }

            // Size presets
            let cardClasses = 'p-4 w-28 h-28';
            let iconClasses = 'w-10 h-10';
            let textClasses = 'text-xs';

            if (shortcutsSize === 'sm') {
                cardClasses = 'p-3 w-20 h-20';
                iconClasses = 'w-7 h-7';
                textClasses = 'text-[10px]';
            } else if (shortcutsSize === 'lg') {
                cardClasses = 'p-5 w-36 h-36';
                iconClasses = 'w-12 h-12';
                textClasses = 'text-sm';
            }

            let html = '';

            // Add button item matching exact design from screenshots
            html += `
                <div onclick="toggleModal('addShortcutModal', true)" 
                     class="${cardClasses} border-2 border-dashed border-white/20 hover:border-white/40 bg-slate-900/30 dark:bg-slate-900/40 hover:bg-white/10 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition group shadow-md backdrop-blur-sm">
                    <i data-lucide="plus" class="w-6 h-6 text-slate-300 group-hover:scale-110 transition"></i>
                    <span class="${textClasses} font-semibold mt-1 text-slate-300">إضافة</span>
                </div>
            `;

            // Shortcut Items
            state.shortcuts.forEach((item, index) => {
                html += `
                    <div class="relative group">
                        <a href="${item.url}" class="${cardClasses} bg-slate-900/50 hover:bg-slate-900/80 border border-white/10 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition shadow-xl backdrop-blur-md hover:scale-105 active:scale-95">
                            <img src="${item.icon}" id="fav-${index}" 
                                 onerror="this.src='https://placehold.co/48x48/6366f1/ffffff?text=${encodeURIComponent(item.title[0])}'" 
                                 class="${iconClasses} object-contain rounded-lg mb-2" />
                            <span class="${textClasses} font-medium text-slate-200 truncate max-w-full text-center">${item.title}</span>
                        </a>
                        <button onclick="deleteShortcut(event, ${index})" class="absolute -top-1 -right-1 p-1 bg-rose-500 text-white rounded-full opacity-0 group-hover:opacity-100 transition shadow-lg hover:scale-110">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
            initLucide();
        }

        // Add & Delete Shortcuts
        function saveShortcut() {
            const title = document.getElementById('shortcutTitle').value.trim();
            let url = document.getElementById('shortcutUrl').value.trim();

            if (!title || !url) return;

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const icon = `https://www.google.com/s2/favicons?domain=${url}&sz=64`;

            state.shortcuts.push({ title, url, icon });
            saveState();
            renderShortcuts();
            toggleModal('addShortcutModal', false);

            document.getElementById('shortcutTitle').value = '';
            document.getElementById('shortcutUrl').value = '';
        }

        function deleteShortcut(e, index) {
            e.stopPropagation();
            state.shortcuts.splice(index, 1);
            saveState();
            renderShortcuts();
        }

        // Clock & Date Formatting Logic using Windows-like tokens
        function formatWindowsDate(date, formatPattern, is12Hour) {
            const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

            let hours = date.getHours();
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            const tt = hours >= 12 ? 'PM' : 'AM';

            let h12 = hours % 12;
            h12 = h12 ? h12 : 12; // Hour 0 is 12

            const dayNum = date.getDate();
            const dd = String(dayNum).padStart(2, '0');
            const dddd = days[date.getDay()];
            const monthNum = date.getMonth() + 1;
            const MM = String(monthNum).padStart(2, '0');
            const MMMM = months[date.getMonth()];
            const yyyy = date.getFullYear();

            let formatted = formatPattern;

            // Time replacement
            formatted = formatted.replace(/h:mm:ss tt/g, `${h12}:${minutes}:${seconds} ${tt}`);
            formatted = formatted.replace(/h:mm tt/g, `${h12}:${minutes} ${tt}`);
            formatted = formatted.replace(/HH:mm:ss/g, `${String(hours).padStart(2, '0')}:${minutes}:${seconds}`);
            formatted = formatted.replace(/HH:mm/g, `${String(hours).padStart(2, '0')}:${minutes}`);

            // Date replacement
            formatted = formatted.replace(/dddd/g, dddd);
            formatted = formatted.replace(/dd/g, dd);
            formatted = formatted.replace(/d/g, dayNum);
            formatted = formatted.replace(/MMMM/g, MMMM);
            formatted = formatted.replace(/MM/g, MM);
            formatted = formatted.replace(/yyyy/g, yyyy);

            return formatted;
        }

        function updateClock() {
            const now = new Date();
            const { clockSystem, timeFormat, dateFormat, showClock, showDate, shortcutsSize } = state.settings;

            const timeEl = document.getElementById('clockTime');
            const dateEl = document.getElementById('clockDate');

            // Text sizing responsive adjustment
            if (shortcutsSize === 'lg') {
                timeEl.className = "text-5xl md:text-6xl font-bold tracking-tight text-slate-100 drop-shadow-md";
            } else {
                timeEl.className = "text-6xl md:text-7xl font-bold tracking-tight text-slate-100 drop-shadow-md";
            }

            if (showClock) {
                timeEl.textContent = formatWindowsDate(now, timeFormat, clockSystem === '12');
                timeEl.style.display = 'block';
            } else {
                timeEl.style.display = 'none';
            }

            if (showDate) {
                dateEl.textContent = formatWindowsDate(now, dateFormat, clockSystem === '12');
                dateEl.style.display = 'block';
            } else {
                dateEl.style.display = 'none';
            }
        }

        function startClock() {
            updateClock();
            setInterval(updateClock, 1000);
        }

        // Settings updates
        function updateSettings() {
            state.settings.searchEngine = document.getElementById('settingEngine').value;
            state.settings.clockSystem = document.getElementById('settingClockSystem').value;
            state.settings.clockPos = document.getElementById('settingClockPos').value;
            state.settings.dateFormat = document.getElementById('settingDateFormat').value;
            state.settings.timeFormat = document.getElementById('settingTimeFormat').value;
            state.settings.showClock = document.getElementById('settingShowClock').checked;
            state.settings.showDate = document.getElementById('settingShowDate').checked;
            state.settings.searchPos = document.getElementById('settingSearchPos').value;
            state.settings.shortcutsPos = document.getElementById('settingShortcutsPos').value;
            state.settings.shortcutsSize = document.getElementById('settingShortcutsSize').value;

            saveState();
            applyState();
        }

        // Search Bar Functionality
        function setSearchFocus(isFocused) {
            if (isFocused) {
                document.body.classList.add('search-focused');
            } else {
                document.body.classList.remove('search-focused');
            }
        }

        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            if (query.startsWith('http://') || query.startsWith('https://')) {
                window.location.href = query;
            } else if (query.includes('.') && !query.includes(' ')) {
                window.location.href = 'https://' + query;
            } else {
                window.location.href = state.settings.searchEngine + encodeURIComponent(query);
            }
        }

        // Custom Background Handler
        function handleBgUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                state.settings.bgImage = event.target.result;
                saveState();
                applyState();
            };
            reader.readAsDataURL(file);
        }

        function removeBackground() {
            state.settings.bgImage = '';
            saveState();
            applyState();
        }

        // Theme Selection
        function setTheme(theme) {
            state.settings.theme = theme;
            saveState();
            applyState();
        }

        // Backup and Restore
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `startpage_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (imported.settings && imported.shortcuts) {
                        state = imported;
                        saveState();
                        applyState();
                        alert('تم استيراد البيانات والإعدادات بنجاح!');
                    }
                } catch(err) {
                    alert('عذراً، الملف غير صالح.');
                }
            };
            reader.readAsText(file);
        }

        // Modal Controls
        function toggleModal(modalId, show) {
            const modal = document.getElementById(modalId);
            if (show) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.classList.add('opacity-100');
            } else {
                modal.classList.remove('opacity-100');
                modal.classList.add('opacity-0', 'pointer-events-none');
            }
        }
    </script>
</body>
</html>
