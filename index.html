<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startpage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(20, 20, 25, 0.55);
            --glass-hover: rgba(35, 35, 45, 0.7);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-blur: blur(30px) saturate(200%);
            --modal-bg: rgba(20, 20, 25, 0.75);
            
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --accent-color: #007aff;
            
            --time-color: #ffffff;
            --time-glow: none;
            --date-color: rgba(255, 255, 255, 0.85);
            --date-glow: none;

            --radius-lg: 24px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.4);

            --bm-size: 96px;
            --bm-icon-size: 32px;
            --bm-font-size: 0.78rem;
            --bg-overlay: rgba(0, 0, 0, 0.25);

            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.light-theme {
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-hover: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.5);
            --modal-bg: rgba(245, 245, 247, 0.8);
            --text-primary: #1c1c1e;
            --text-secondary: rgba(60, 60, 67, 0.75);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.12);
            --bg-overlay: rgba(255, 255, 255, 0.1);
        }

        body.bm-small { --bm-size: 72px; --bm-icon-size: 24px; --bm-font-size: 0.7rem; }
        body.bm-medium { --bm-size: 96px; --bm-icon-size: 32px; --bm-font-size: 0.78rem; }
        body.bm-large { --bm-size: 120px; --bm-icon-size: 40px; --bm-font-size: 0.9rem; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            height: 100vh;
            width: 100vw;
            background-color: #0d0e15;
            background-image: radial-gradient(circle at 50% 30%, #2e1065 0%, #0d0e15 80%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
            transition: background 0.5s var(--transition-smooth), color 0.5s var(--transition-smooth);
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--bg-overlay);
            z-index: 1;
            pointer-events: none;
            transition: background 0.5s var(--transition-smooth);
        }

        .customize-floating-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 50;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: all 0.35s var(--transition-smooth);
            outline: none;
            display: flex;
            flex-direction: row-reverse;
            align-items: center;
            gap: 8px;
        }

        .customize-floating-btn:hover {
            background: var(--glass-hover);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .customize-floating-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.4s var(--transition-smooth);
        }

        .customize-floating-btn:hover svg {
            transform: rotate(45deg);
        }

        .focusable-element {
            transition: opacity 0.45s var(--transition-smooth), 
                        transform 0.45s var(--transition-smooth),
                        filter 0.45s var(--transition-smooth);
        }

        body.focus-mode .focusable-element {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: scale(0.92) translateY(12px);
            filter: blur(12px);
        }

        /* Clock Elements */
        #clock-wrapper {
            position: absolute;
            z-index: 10;
            user-select: none;
            text-align: center;
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: all 0.45s var(--transition-smooth);
        }

        #clock {
            font-size: 6rem;
            font-weight: 700;
            letter-spacing: -2px;
            color: var(--time-color);
            line-height: 1;
            filter: var(--time-glow);
            transition: color 0.4s var(--transition-smooth), filter 0.4s var(--transition-smooth);
        }

        #clock.clock-glass-style {
            background: rgba(255, 255, 255, 0.22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.45), 0 0 50px rgba(255, 255, 255, 0.2);
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.3));
        }

        #date {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--date-color);
            letter-spacing: -0.2px;
            filter: var(--date-glow);
            transition: color 0.4s var(--transition-smooth), filter 0.4s var(--transition-smooth);
        }

        #date.date-glass-style {
            background: rgba(255, 255, 255, 0.35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* Color Picker Input Styling */
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }

        .color-input-custom {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 42px;
            height: 42px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            background: transparent;
        }

        .color-input-custom::-webkit-color-swatch-wrapper { padding: 0; }
        .color-input-custom::-webkit-color-swatch { border: 1px solid var(--glass-border); border-radius: var(--radius-sm); }

        /* Fixed Clock Positions */
        .clock-top-center { 
            top: 40px; 
            left: 50%; 
            right: auto;
            transform: translateX(-50%); 
        }
        .clock-top-left { 
            top: 40px; 
            left: 40px; 
            right: auto;
            transform: none !important; 
        }
        .clock-top-right { 
            top: 40px; 
            right: 40px; 
            left: auto;
            transform: none !important; 
        }

        /* Search Bar */
        .search-wrapper {
            position: absolute;
            width: 90%;
            max-width: 650px;
            z-index: 30;
            transition: all 0.45s var(--transition-smooth);
        }

        .search-pos-top-center { 
            top: 220px; 
            left: 50%; 
            transform: translateX(-50%); 
        }
        .search-pos-center { 
            top: 48%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
        }

        body.focus-mode .search-wrapper {
            top: 42% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1.02) !important;
        }

        .search-container-box {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            transition: all 0.35s var(--transition-smooth);
        }

        .search-container-box:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 35px rgba(0, 122, 255, 0.35);
        }

        .search-box {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 14px 20px;
            gap: 12px;
        }

        .search-engine-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.3s var(--transition-smooth);
        }

        .search-container-box:focus-within .search-engine-icon {
            transform: scale(1.15);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1.05rem;
            font-weight: 500;
            padding: 4px 0;
            width: 100%;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.85;
        }

        .search-icon-right {
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.25s var(--transition-smooth), fill 0.25s var(--transition-smooth);
        }

        .search-icon-right:hover {
            fill: var(--text-primary);
            transform: scale(1.15);
        }

        .search-history-dropdown {
            display: none;
            border-top: 1px solid var(--glass-border);
            padding: 8px 0;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.3s var(--transition-smooth), transform 0.3s var(--transition-smooth);
        }

        .search-history-dropdown.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            color: var(--text-primary);
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s var(--transition-smooth), transform 0.2s var(--transition-smooth);
        }

        .history-item:hover {
            background: var(--glass-hover);
            transform: translateX(-4px);
        }

        .history-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .history-item-left svg {
            width: 16px;
            height: 16px;
            fill: var(--text-secondary);
            flex-shrink: 0;
        }

        .history-delete-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .history-delete-btn:hover {
            color: #ef4444;
            transform: scale(1.2);
        }

        /* Bookmarks */
        .bookmarks-section {
            position: absolute;
            width: 90%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            z-index: 20;
            transition: all 0.45s var(--transition-smooth);
        }

        .bm-pos-bottom {
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        .bm-pos-center-below {
            top: calc(50% + 120px);
            left: 50%;
            transform: translateX(-50%);
        }

        .bookmark-card {
            position: relative;
            width: var(--bm-size);
            height: var(--bm-size);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            gap: 8px;
            transition: all 0.35s var(--transition-smooth);
            cursor: pointer;
            box-shadow: var(--shadow-lg);
        }

        .bookmark-card:hover {
            background: var(--glass-hover);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-6px) scale(1.04);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
        }

        .bookmark-card:active {
            transform: translateY(-2px) scale(0.97);
        }

        .bookmark-icon {
            width: var(--bm-icon-size);
            height: var(--bm-icon-size);
            border-radius: var(--radius-sm);
            object-fit: contain;
            transition: transform 0.3s var(--transition-smooth);
        }

        .bookmark-card:hover .bookmark-icon {
            transform: scale(1.08);
        }

        .bookmark-title {
            font-size: var(--bm-font-size);
            color: var(--text-primary);
            width: 85%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .bookmark-add-btn {
            border: 1px dashed var(--glass-border);
            background: var(--glass-bg);
        }

        .bookmark-add-btn:hover {
            border-color: var(--accent-color);
            background: var(--glass-hover);
        }

        .bookmark-add-icon {
            width: var(--bm-icon-size);
            height: var(--bm-icon-size);
            fill: var(--text-secondary);
            transition: transform 0.3s var(--transition-smooth), fill 0.3s var(--transition-smooth);
        }

        .bookmark-add-btn:hover .bookmark-add-icon {
            fill: var(--text-primary);
            transform: rotate(90deg) scale(1.1);
        }

        .bookmark-delete {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ef4444;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.25s var(--transition-smooth);
            cursor: pointer;
            border: none;
        }

        .bookmark-card:hover .bookmark-delete {
            opacity: 1;
            transform: scale(1);
        }

        .bookmark-delete:hover {
            background: #dc2626;
            transform: scale(1.15) !important;
        }

        /* Modal Base */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s var(--transition-smooth), visibility 0.35s var(--transition-smooth);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-body {
            background: var(--modal-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 480px;
            padding: 28px;
            box-shadow: var(--shadow-lg);
            transform: scale(0.92) translateY(15px);
            opacity: 0;
            transition: transform 0.35s var(--transition-smooth), opacity 0.35s var(--transition-smooth);
            color: var(--text-primary);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-body {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .modal-title { font-size: 1.25rem; font-weight: 600; }
        .modal-close { 
            background: transparent; 
            border: none; 
            color: var(--text-secondary); 
            font-size: 1.5rem; 
            cursor: pointer; 
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .modal-close:hover { color: var(--text-primary); transform: scale(1.15); }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.25s var(--transition-smooth), box-shadow 0.25s var(--transition-smooth);
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(0, 122, 255, 0.25);
        }

        select.form-control option { background: #1e1f24; color: #fff; }
        body.light-theme select.form-control option { background: #ffffff; color: #000; }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s var(--transition-smooth), background 0.2s var(--transition-smooth);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background: #0062cc;
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s var(--transition-smooth), color 0.2s var(--transition-smooth);
        }

        .btn-secondary:hover {
            background: var(--glass-hover);
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <button class="customize-floating-btn focusable-element" onclick="openModal('settingsModal')">
        <svg viewBox="0 0 24 24">
            <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/>
        </svg>
        <span>Customize</span>
    </button>

    <div id="clock-wrapper" class="focusable-element clock-top-center">
        <div id="clock">--:--</div>
        <div id="date">----/--/--</div>
    </div>

    <div class="search-wrapper search-pos-center" id="searchWrapper">
        <div class="search-container-box">
            <div class="search-box">
                <div class="search-engine-icon" id="engineIcon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="#f97316">
                        <path d="M12 2L2 7l1.5 9 8.5 6 8.5-6 1.5-9L12 2zm0 3.8l5.8 2.9-1 5.8-4.8 3.4-4.8-3.4-1-5.8L12 5.8z"/>
                    </svg>
                </div>
                <input type="text" class="search-input" id="searchInput" placeholder="ابحث أو اكتب عنوان موقع..." autocomplete="off">
                <svg class="search-icon-right" viewBox="0 0 24 24" onclick="executeSearch(searchInput.value)">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </div>
            <div class="search-history-dropdown" id="searchHistoryDropdown"></div>
        </div>
    </div>

    <div class="bookmarks-section focusable-element bm-pos-bottom" id="bookmarksContainer"></div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-body">
            <div class="modal-header">
                <h3 class="modal-title">Settings / الإعدادات</h3>
                <button class="modal-close" onclick="closeModal('settingsModal')">&times;</button>
            </div>

            <div class="form-group">
                <label class="form-label">نوع الخط (Font Family):</label>
                <select class="form-control" id="fontSelect">
                    <option value="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">SF Pro (Apple Default)</option>
                    <option value="'Inter', sans-serif">Inter</option>
                    <option value="'Plus Jakarta Sans', sans-serif">Plus Jakarta Sans</option>
                    <option value="'Lexend', sans-serif">Lexend</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">ثيم ونمط الوقت (Time Style):</label>
                <select class="form-control" id="timeStyleSelect">
                    <option value="glass">1. زجاجي شفاف (iOS Glass)</option>
                    <option value="glow">2. توهج لامع (Glow)</option>
                    <option value="glow-glass">3. زجاجي متوهج (Glow Glass)</option>
                    <option value="solid">4. لون عادي (Solid Color)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">لون الوقت المخصص:</label>
                <div class="color-picker-wrapper">
                    <input type="color" class="color-input-custom" id="timeColorPicker" value="#ffffff">
                    <span style="font-size:0.85rem; color:var(--text-secondary);">اختر اللون المفضل</span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">ثيم ونمط التاريخ (Date Style):</label>
                <select class="form-control" id="dateStyleSelect">
                    <option value="glass">1. زجاجي شفاف (iOS Glass)</option>
                    <option value="glow">2. توهج لامع (Glow)</option>
                    <option value="glow-glass">3. زجاجي متوهج (Glow Glass)</option>
                    <option value="solid">4. لون عادي (Solid Color)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">لون التاريخ المخصص:</label>
                <div class="color-picker-wrapper">
                    <input type="color" class="color-input-custom" id="dateColorPicker" value="#ffffff">
                    <span style="font-size:0.85rem; color:var(--text-secondary);">اختر اللون المفضل</span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">لغة الوقت والتاريخ (Time/Date Language):</label>
                <select class="form-control" id="dateLangSelect">
                    <option value="ar">العربية (Arabic)</option>
                    <option value="en">English (الإنجليزية)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">تنسيق الوقت (Time Format):</label>
                <input type="text" class="form-control" id="timeFormatInput" placeholder="مثال: HH:mm أو hh:mm A">
            </div>

            <div class="form-group">
                <label class="form-label">تنسيق التاريخ (Date Format):</label>
                <input type="text" class="form-control" id="dateFormatInput" placeholder="مثال: dddd, D MMMM أو YYYY-MM-DD">
            </div>

            <div class="form-group">
                <label class="form-label">محرك البحث الإفتراضي:</label>
                <select class="form-control" id="searchEngineSelect">
                    <option value="brave">Brave</option>
                    <option value="google">Google</option>
                    <option value="bing">Bing</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">عرض / إخفاء العناصر:</label>
                <select class="form-control" id="clockDisplaySelect">
                    <option value="both">إظهار الوقت والتاريخ</option>
                    <option value="time-only">إظهار الوقت فقط</option>
                    <option value="date-only">إظهار التاريخ فقط</option>
                    <option value="none">إخفاء كلاهما</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">موقع الساعة والتاريخ:</label>
                <select class="form-control" id="clockPosSelect">
                    <option value="clock-top-center">أعلى الوسط</option>
                    <option value="clock-top-left">أعلى اليسار</option>
                    <option value="clock-top-right">أعلى اليمين</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">موقع شريط البحث:</label>
                <select class="form-control" id="searchPosSelect">
                    <option value="search-pos-center">في المنتصف</option>
                    <option value="search-pos-top-center">المنتصف الأعلى</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">موقع الصفحات المفضلة:</label>
                <select class="form-control" id="bookmarkPosSelect">
                    <option value="bm-pos-bottom">أسفل الصفحة</option>
                    <option value="bm-pos-center-below">تحت المنتصف (تحت البحث)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">حجم الصفحات المفضلة:</label>
                <select class="form-control" id="bookmarkSizeSelect">
                    <option value="bm-small">صغير (Small)</option>
                    <option value="bm-medium">متوسط (Medium)</option>
                    <option value="bm-large">كبير (Large)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">خلفية المظهر:</label>
                <input type="file" class="form-control" id="bgInput" accept="image/*">
                <button class="btn-secondary" onclick="resetBg()">إزالة الخلفية المخصصة</button>
            </div>

            <div class="form-group">
                <label class="form-label">المظهر (Theme):</label>
                <select class="form-control" id="themeSelect">
                    <option value="dark">داكن (Dark)</option>
                    <option value="light">مضيء (Light)</option>
                </select>
            </div>

            <button class="btn-primary" onclick="closeModal('settingsModal')">حفظ وإغلاق</button>
        </div>
    </div>

    <div class="modal-overlay" id="addSiteModal">
        <div class="modal-body">
            <div class="modal-header">
                <h3 class="modal-title">إضافة موقع مفضل</h3>
                <button class="modal-close" onclick="closeModal('addSiteModal')">&times;</button>
            </div>

            <div class="form-group">
                <label class="form-label">اسم الموقع:</label>
                <input type="text" class="form-control" id="siteNameInput" placeholder="مثال: Google">
            </div>

            <div class="form-group">
                <label class="form-label">الرابط (URL):</label>
                <input type="url" class="form-control" id="siteUrlInput" placeholder="https://www.example.com">
            </div>

            <button class="btn-primary" onclick="handleAddSite()">إضافة الموقع</button>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('layout_version_v4')) {
            localStorage.removeItem('clockPos');
            localStorage.removeItem('searchPos');
            localStorage.removeItem('bookmarkPos');
            localStorage.setItem('layout_version_v4', 'true');
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        const clockEl = document.getElementById('clock');
        const dateEl = document.getElementById('date');
        const clockWrapper = document.getElementById('clock-wrapper');

        function hexToRgba(hex, alpha) {
            let c;
            if (/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)) {
                c = hex.substring(1).split('');
                if (c.length === 3) {
                    c = [c[0], c[0], c[1], c[1], c[2], c[2]];
                }
                c = '0x' + c.join('');
                return 'rgba(' + [(c >> 16) & 255, (c >> 8) & 255, c & 255].join(',') + ',' + alpha + ')';
            }
            return hex;
        }

        function setFont(fontFamily) {
            document.body.style.fontFamily = fontFamily;
            const elements = document.querySelectorAll('*');
            elements.forEach(el => el.style.fontFamily = fontFamily);
            localStorage.setItem('selectedFont', fontFamily);
        }

        document.getElementById('fontSelect').addEventListener('change', (e) => {
            setFont(e.target.value);
        });

        function applyTimeTheme(style, color) {
            clockEl.classList.remove('clock-glass-style');
            clockEl.style.background = 'none';
            clockEl.style.webkitBackgroundClip = 'initial';
            clockEl.style.webkitTextFillColor = 'initial';

            if (style === 'glass') {
                clockEl.classList.add('clock-glass-style');
                clockEl.style.background = hexToRgba(color, 0.28);
                clockEl.style.webkitBackgroundClip = 'text';
                clockEl.style.webkitTextFillColor = 'transparent';
                clockEl.style.textShadow = `0 0 25px ${hexToRgba(color, 0.45)}, 0 0 50px ${hexToRgba(color, 0.2)}`;
                document.documentElement.style.setProperty('--time-glow', 'drop-shadow(0 4px 15px rgba(0, 0, 0, 0.35))');
            } else if (style === 'glow') {
                document.documentElement.style.setProperty('--time-color', color);
                document.documentElement.style.setProperty('--time-glow', `drop-shadow(0 0 12px ${color}) drop-shadow(0 0 30px ${color})`);
                clockEl.style.textShadow = 'none';
            } else if (style === 'glow-glass') {
                clockEl.classList.add('clock-glass-style');
                clockEl.style.background = hexToRgba(color, 0.4);
                clockEl.style.webkitBackgroundClip = 'text';
                clockEl.style.webkitTextFillColor = 'transparent';
                clockEl.style.textShadow = `0 0 20px ${color}, 0 0 40px ${color}`;
                document.documentElement.style.setProperty('--time-glow', 'drop-shadow(0 4px 20px rgba(0, 0, 0, 0.4))');
            } else {
                document.documentElement.style.setProperty('--time-color', color);
                document.documentElement.style.setProperty('--time-glow', 'none');
                clockEl.style.textShadow = 'none';
            }
        }

        function applyDateTheme(style, color) {
            dateEl.classList.remove('date-glass-style');
            dateEl.style.background = 'none';
            dateEl.style.webkitBackgroundClip = 'initial';
            dateEl.style.webkitTextFillColor = 'initial';

            if (style === 'glass') {
                dateEl.classList.add('date-glass-style');
                dateEl.style.background = hexToRgba(color, 0.45);
                dateEl.style.webkitBackgroundClip = 'text';
                dateEl.style.webkitTextFillColor = 'transparent';
                dateEl.style.textShadow = `0 0 15px ${hexToRgba(color, 0.35)}`;
                document.documentElement.style.setProperty('--date-glow', 'drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3))');
            } else if (style === 'glow') {
                document.documentElement.style.setProperty('--date-color', color);
                document.documentElement.style.setProperty('--date-glow', `drop-shadow(0 0 8px ${color}) drop-shadow(0 0 18px ${color})`);
                dateEl.style.textShadow = 'none';
            } else if (style === 'glow-glass') {
                dateEl.classList.add('date-glass-style');
                dateEl.style.background = hexToRgba(color, 0.55);
                dateEl.style.webkitBackgroundClip = 'text';
                dateEl.style.webkitTextFillColor = 'transparent';
                dateEl.style.textShadow = `0 0 12px ${color}`;
                document.documentElement.style.setProperty('--date-glow', 'drop-shadow(0 2px 10px rgba(0, 0, 0, 0.35))');
            } else {
                document.documentElement.style.setProperty('--date-color', color);
                document.documentElement.style.setProperty('--date-glow', 'none');
                dateEl.style.textShadow = 'none';
            }
        }

        function formatDateTime(now, pattern, lang) {
            if (!pattern || typeof pattern !== 'string') return '';
            const locale = lang === 'ar' ? 'ar-SA' : 'en-US';
            
            const hours24 = now.getHours();
            const hours12 = hours24 % 12 || 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();

            const monthNameFull = now.toLocaleDateString(locale, { month: 'long' });
            const monthNameShort = now.toLocaleDateString(locale, { month: 'short' });
            const dayNameFull = now.toLocaleDateString(locale, { weekday: 'long' });
            const ampm = now.toLocaleTimeString(locale, { hour12: true }).slice(-2);

            let res = pattern;
            res = res.replace(/HH/g, String(hours24).padStart(2, '0'));
            res = res.replace(/hh/g, String(hours12).padStart(2, '0'));
            res = res.replace(/mm/g, String(minutes).padStart(2, '0'));
            res = res.replace(/ss/g, String(seconds).padStart(2, '0'));
            res = res.replace(/A/g, ampm);

            res = res.replace(/YYYY/g, year);
            res = res.replace(/MMMM/g, monthNameFull);
            res = res.replace(/MMM/g, monthNameShort);
            res = res.replace(/MM/g, String(month).padStart(2, '0'));
            res = res.replace(/dddd/g, dayNameFull);
            res = res.replace(/DD/g, String(day).padStart(2, '0'));
            res = res.replace(/D/g, day);

            return res;
        }

        function updateClock() {
            const now = new Date();
            const lang = localStorage.getItem('dateLang') || 'ar';
            const displayMode = localStorage.getItem('clockDisplay') || 'both';
            const timePattern = localStorage.getItem('timeFormat') || 'HH:mm';
            const datePattern = localStorage.getItem('dateFormat') || (lang === 'ar' ? 'dddd، D MMMM' : 'dddd, MMMM D');

            if (displayMode === 'none') {
                clockWrapper.style.display = 'none';
                return;
            }

            clockWrapper.style.display = 'flex';

            if (displayMode === 'both' || displayMode === 'time-only') {
                clockEl.style.display = 'block';
                clockEl.innerText = formatDateTime(now, timePattern, lang) || '00:00';
            } else clockEl.style.display = 'none';

            if (displayMode === 'both' || displayMode === 'date-only') {
                dateEl.style.display = 'block';
                dateEl.innerText = formatDateTime(now, datePattern, lang);
            } else dateEl.style.display = 'none';
        }

        setInterval(updateClock, 1000);

        document.getElementById('timeStyleSelect').addEventListener('change', (e) => {
            const style = e.target.value;
            const color = document.getElementById('timeColorPicker').value;
            applyTimeTheme(style, color);
            localStorage.setItem('timeStyle', style);
        });

        document.getElementById('timeColorPicker').addEventListener('input', (e) => {
            const color = e.target.value;
            const style = document.getElementById('timeStyleSelect').value;
            applyTimeTheme(style, color);
            localStorage.setItem('timeColorHex', color);
        });

        document.getElementById('dateStyleSelect').addEventListener('change', (e) => {
            const style = e.target.value;
            const color = document.getElementById('dateColorPicker').value;
            applyDateTheme(style, color);
            localStorage.setItem('dateStyle', style);
        });

        document.getElementById('dateColorPicker').addEventListener('input', (e) => {
            const color = e.target.value;
            const style = document.getElementById('dateStyleSelect').value;
            applyDateTheme(style, color);
            localStorage.setItem('dateColorHex', color);
        });

        document.getElementById('dateLangSelect').addEventListener('change', (e) => {
            localStorage.setItem('dateLang', e.target.value);
            updateClock();
        });

        document.getElementById('timeFormatInput').addEventListener('input', (e) => {
            localStorage.setItem('timeFormat', e.target.value);
            updateClock();
        });

        document.getElementById('dateFormatInput').addEventListener('input', (e) => {
            localStorage.setItem('dateFormat', e.target.value);
            updateClock();
        });

        document.getElementById('clockPosSelect').addEventListener('change', (e) => {
            clockWrapper.className = 'focusable-element ' + e.target.value;
            localStorage.setItem('clockPos', e.target.value);
        });

        const searchWrapper = document.getElementById('searchWrapper');
        document.getElementById('searchPosSelect').addEventListener('change', (e) => {
            searchWrapper.className = 'search-wrapper ' + e.target.value;
            localStorage.setItem('searchPos', e.target.value);
        });

        const bookmarksContainer = document.getElementById('bookmarksContainer');
        document.getElementById('bookmarkPosSelect').addEventListener('change', (e) => {
            bookmarksContainer.className = 'bookmarks-section focusable-element ' + e.target.value;
            localStorage.setItem('bookmarkPos', e.target.value);
        });

        document.getElementById('searchEngineSelect').addEventListener('change', (e) => {
            localStorage.setItem('searchEngine', e.target.value);
        });

        document.getElementById('bookmarkSizeSelect').addEventListener('change', (e) => {
            setBookmarkSize(e.target.value);
        });

        function setBookmarkSize(sizeClass) {
            document.body.classList.remove('bm-small', 'bm-medium', 'bm-large');
            document.body.classList.add(sizeClass);
            localStorage.setItem('bookmarkSize', sizeClass);
        }

        document.getElementById('themeSelect').addEventListener('change', (e) => {
            setTheme(e.target.value);
        });

        function setTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
            localStorage.setItem('theme', theme);
        }

        document.getElementById('clockDisplaySelect').addEventListener('change', (e) => {
            localStorage.setItem('clockDisplay', e.target.value);
            updateClock();
        });

        document.getElementById('bgInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const bgUrl = event.target.result;
                    document.body.style.backgroundImage = `url('${bgUrl}')`;
                    localStorage.setItem('customBg', bgUrl);
                };
                reader.readAsDataURL(file);
            }
        });

        function resetBg() {
            localStorage.removeItem('customBg');
            document.body.style.backgroundImage = '';
        }

        /* Default Values Initialization */
        const savedClockPos = localStorage.getItem('clockPos') || 'clock-top-center';
        const savedSearchPos = localStorage.getItem('searchPos') || 'search-pos-center';
        const savedBookmarkPos = localStorage.getItem('bookmarkPos') || 'bm-pos-bottom';
        const savedEngine = localStorage.getItem('searchEngine') || 'google';
        const savedTheme = localStorage.getItem('theme') || 'dark';
        const savedBmSize = localStorage.getItem('bookmarkSize') || 'bm-medium';
        const savedClockDisplay = localStorage.getItem('clockDisplay') || 'both';
        const savedDateLang = localStorage.getItem('dateLang') || 'ar';
        const savedTimeFormat = localStorage.getItem('timeFormat') || 'HH:mm';
        const savedDateFormat = localStorage.getItem('dateFormat') || '';
        
        const savedTimeStyle = localStorage.getItem('timeStyle') || 'glass';
        const savedTimeColorHex = localStorage.getItem('timeColorHex') || '#ffffff';
        const savedDateStyle = localStorage.getItem('dateStyle') || 'glass';
        const savedDateColorHex = localStorage.getItem('dateColorHex') || '#ffffff';

        const savedFont = localStorage.getItem('selectedFont') || "-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif";

        clockWrapper.className = 'focusable-element ' + savedClockPos;
        searchWrapper.className = 'search-wrapper ' + savedSearchPos;
        bookmarksContainer.className = 'bookmarks-section focusable-element ' + savedBookmarkPos;

        document.getElementById('clockPosSelect').value = savedClockPos;
        document.getElementById('searchPosSelect').value = savedSearchPos;
        document.getElementById('bookmarkPosSelect').value = savedBookmarkPos;
        document.getElementById('searchEngineSelect').value = savedEngine;
        document.getElementById('themeSelect').value = savedTheme;
        document.getElementById('bookmarkSizeSelect').value = savedBmSize;
        document.getElementById('clockDisplaySelect').value = savedClockDisplay;
        document.getElementById('dateLangSelect').value = savedDateLang;
        document.getElementById('timeFormatInput').value = savedTimeFormat;
        document.getElementById('dateFormatInput').value = savedDateFormat;

        document.getElementById('timeStyleSelect').value = savedTimeStyle;
        document.getElementById('timeColorPicker').value = savedTimeColorHex;
        document.getElementById('dateStyleSelect').value = savedDateStyle;
        document.getElementById('dateColorPicker').value = savedDateColorHex;

        document.getElementById('fontSelect').value = savedFont;

        applyTimeTheme(savedTimeStyle, savedTimeColorHex);
        applyDateTheme(savedDateStyle, savedDateColorHex);

        setFont(savedFont);
        setTheme(savedTheme);
        setBookmarkSize(savedBmSize);
        updateClock();

        const savedBg = localStorage.getItem('customBg');
        if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;

        const searchInput = document.getElementById('searchInput');
        const historyDropdown = document.getElementById('searchHistoryDropdown');

        function getSearchHistory() {
            const history = localStorage.getItem('searchHistory');
            return history ? JSON.parse(history) : [];
        }

        function saveSearchHistory(query) {
            if (!query.trim()) return;
            let history = getSearchHistory();
            history = history.filter(item => item !== query);
            history.unshift(query);
            if (history.length > 5) history = history.slice(0, 5);
            localStorage.setItem('searchHistory', JSON.stringify(history));
        }

        function removeHistoryItem(e, item) {
            e.stopPropagation();
            let history = getSearchHistory();
            history = history.filter(h => h !== item);
            localStorage.setItem('searchHistory', JSON.stringify(history));
            renderSearchHistory();
        }

        function renderSearchHistory() {
            const history = getSearchHistory();
            if (history.length === 0) {
                historyDropdown.classList.remove('active');
                return;
            }
            historyDropdown.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-item-left">
                        <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 7.07 7.07 0 0 1-6-3.44L5.56 17A8.96 8.96 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                        <span>${item}</span>
                    </div>
                    <button class="history-delete-btn" title="حذف">&times;</button>
                `;
                div.querySelector('.history-delete-btn').addEventListener('click', (e) => removeHistoryItem(e, item));
                div.addEventListener('click', () => {
                    searchInput.value = item;
                    executeSearch(item);
                });
                historyDropdown.appendChild(div);
            });
        }

        searchInput.addEventListener('focus', () => {
            document.body.classList.add('focus-mode');
            renderSearchHistory();
            if (getSearchHistory().length > 0) {
                historyDropdown.classList.add('active');
            }
        });

        document.addEventListener('click', (e) => {
            if (!searchWrapper.contains(e.target)) {
                document.body.classList.remove('focus-mode');
                historyDropdown.classList.remove('active');
            }
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                executeSearch(searchInput.value);
            }
        });

        function executeSearch(query) {
            if (!query.trim()) return;

            saveSearchHistory(query);

            const engine = localStorage.getItem('searchEngine') || 'google';
            let url = '';

            if (query.startsWith('http://') || query.startsWith('https://') || (query.includes('.') && !query.includes(' '))) {
                url = query.startsWith('http') ? query : 'https://' + query;
            } else {
                switch (engine) {
                    case 'google': url = `https://www.google.com/search?q=${encodeURIComponent(query)}`; break;
                    case 'bing': url = `https://www.bing.com/search?q=${encodeURIComponent(query)}`; break;
                    case 'duckduckgo': url = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`; break;
                    default: url = `https://search.brave.com/search?q=${encodeURIComponent(query)}`; break;
                }
            }
            window.location.href = url;
        }

        const defaultBookmarks = [
            { name: 'Google', url: 'https://www.google.com' },
            { name: 'YouTube', url: 'https://www.youtube.com' },
            { name: 'GitHub', url: 'https://www.github.com' }
        ];

        function getBookmarks() {
            const saved = localStorage.getItem('bookmarks');
            return saved ? JSON.parse(saved) : defaultBookmarks;
        }

        function saveBookmarks(bookmarks) {
            localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
            renderBookmarks();
        }

        function renderBookmarks() {
            const bookmarks = getBookmarks();
            bookmarksContainer.innerHTML = '';

            bookmarks.forEach((bm, index) => {
                const domain = new URL(bm.url).hostname;
                const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;

                const card = document.createElement('a');
                card.className = 'bookmark-card';
                card.href = bm.url;

                card.innerHTML = `
                    <button class="bookmark-delete" onclick="deleteBookmark(event, ${index})" title="حذف">&times;</button>
                    <img class="bookmark-icon" src="${iconUrl}" alt="${bm.name}" onerror="this.src='https://via.placeholder.com/32'">
                    <span class="bookmark-title">${bm.name}</span>
                `;
                bookmarksContainer.appendChild(card);
            });

            const addBtn = document.createElement('div');
            addBtn.className = 'bookmark-card bookmark-add-btn';
            addBtn.onclick = () => openModal('addSiteModal');
            addBtn.innerHTML = `
                <svg class="bookmark-add-icon" viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
                <span class="bookmark-title">إضافة</span>
            `;
            bookmarksContainer.appendChild(addBtn);
        }

        function handleAddSite() {
            const name = document.getElementById('siteNameInput').value.trim();
            let url = document.getElementById('siteUrlInput').value.trim();

            if (!name || !url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const bookmarks = getBookmarks();
            bookmarks.push({ name, url });
            saveBookmarks(bookmarks);

            document.getElementById('siteNameInput').value = '';
            document.getElementById('siteUrlInput').value = '';
            closeModal('addSiteModal');
        }

        function deleteBookmark(event, index) {
            event.preventDefault();
            event.stopPropagation();
            const bookmarks = getBookmarks();
            bookmarks.splice(index, 1);
            saveBookmarks(bookmarks);
        }

        renderBookmarks();
    </script>
</body>
</html>
