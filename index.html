<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startpage</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            background: #0f0f17 center/cover no-repeat fixed;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* الطبقة الشفافة لتعتيم الخلفية */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
            transition: opacity 0.4s ease;
        }

        /* زر الإعدادات الأنيق */
        .settings-btn {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 50;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .settings-btn:hover {
            transform: rotate(90deg) scale(1.1);
            background: rgba(255, 255, 255, 0.25);
        }

        /* نافذة الإعدادات */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal.active { display: flex; opacity: 1; }

        .modal-content {
            background: rgba(24, 24, 37, 0.95);
            padding: 25px;
            border-radius: 20px;
            width: 360px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content h3 { font-weight: 600; margin-bottom: 5px; color: #89b4fa; }
        .modal-content label { font-size: 0.85rem; color: #a6adc8; display: flex; flex-direction: column; gap: 5px; }
        .modal-content input, .modal-content select {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 10px;
            outline: none;
            font-size: 0.9rem;
        }
        .modal-content select option { background: #181825; color: #fff; }

        /* العناصر القابلة للإخفاء مع الفوكس */
        .focusable {
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }
        body.focus-mode .focusable {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: scale(0.95);
        }

        /* الساعة */
        #clock {
            position: absolute;
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        .clock-top-left { top: 40px; left: 40px; transform: none; }
        .clock-top-center { top: 40px; left: 50%; transform: translateX(-50%); }
        .clock-top-right { top: 40px; right: 40px; transform: none; }
        .clock-center { top: 35%; left: 50%; transform: translate(-50%, -50%); }

        /* شريط البحث */
        .search-container {
            position: absolute;
            width: 90%;
            max-width: 600px;
            z-index: 20;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .search-top-center { top: 130px; left: 50%; transform: translateX(-50%); }
        .search-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .search-box {
            position: relative;
            background: rgba(24, 24, 37, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            padding: 0 18px;
            transition: all 0.3s ease;
        }
        .search-container.active .search-box {
            border-radius: 16px 16px 0 0;
            background: rgba(30, 30, 46, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .search-icon { width: 20px; height: 20px; fill: #a6adc8; margin-left: 12px; }
        .search-input {
            width: 100%;
            padding: 16px 0;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.05rem;
            outline: none;
        }

        /* قائمة الاقتراحات */
        .suggestions {
            display: none;
            position: absolute;
            top: 100%; left: 0; right: 0;
            background: rgba(30, 30, 46, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 0 0 16px 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .search-container.active .suggestions { display: block; }

        .suggestion-item {
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
            color: #cdd6f4;
            font-size: 0.95rem;
        }
        .suggestion-item:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
        .suggestion-item svg { width: 16px; height: 16px; fill: #7f849c; }

        /* الصفحات المفضلة */
        .bookmarks {
            position: absolute;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
            width: 90%;
            max-width: 800px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bm-center-top { top: 30%; left: 50%; transform: translateX(-50%); }
        .bm-center { top: 65%; left: 50%; transform: translateX(-50%); }
        .bm-bottom { bottom: 60px; left: 50%; transform: translateX(-50%); }

        .bm-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #cdd6f4;
            width: 80px;
            position: relative;
            group: relative;
        }
        .bm-icon {
            width: 55px;
            height: 55px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .bm-icon img { width: 26px; height: 26px; border-radius: 6px; }
        .bm-card:hover .bm-icon {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }
        .bm-title { font-size: 0.8rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        
        .bm-delete {
            position: absolute;
            top: -4px; right: 8px;
            width: 20px; height: 20px;
            border-radius: 50%;
            background: #f38ba8;
            color: #11111b;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
        }
        .bm-card:hover .bm-delete { display: flex; }

        .add-bm-btn { cursor: pointer; }
        .add-bm-btn .bm-icon { border: 2px dashed rgba(255, 255, 255, 0.2); font-size: 1.4rem; color: #a6adc8; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <!-- زر الإعدادات -->
    <button class="settings-btn" onclick="toggleModal(true)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>

    <!-- نافذة الإعدادات -->
    <div class="modal" id="settingsModal" onclick="if(event.target===this) toggleModal(false)">
        <div class="modal-content">
            <h3>الإعدادات</h3>
            
            <label>تنسيق الساعة والتاريخ بالتخصيص:
                <input type="text" id="timeFormatInput" placeholder="HH:mm:ss أو DD/MM/YYYY">
                <small style="color:#7f849c; font-size:0.75rem; margin-top:2px;">
                    الرموز المتاحة: HH (ساعات 24), hh (ساعات 12), mm (دقائق), ss (ثواني), A (AM/PM), YYYY (سنة), MM (شهر), DD (يوم), dddd (اسم اليوم)
                </small>
            </label>

            <label>موقع الساعة:
                <select id="clockPosSelect">
                    <option value="clock-top-left">أعلى اليسار</option>
                    <option value="clock-top-center">أعلى الوسط</option>
                    <option value="clock-top-right">أعلى اليمين</option>
                    <option value="clock-center">في المنتصف</option>
                </select>
            </label>

            <label>موقع شريط البحث:
                <select id="searchPosSelect">
                    <option value="search-top-center">أعلى المنتصف</option>
                    <option value="search-center">في المنتصف</option>
                </select>
            </label>

            <label>موقع المواقع المفضلة:
                <select id="bmPosSelect">
                    <option value="bm-center-top">أعلى المنتصف</option>
                    <option value="bm-center">منتصف الصفحة</option>
                    <option value="bm-bottom">أسفل الصفحة</option>
                </select>
            </label>

            <label>خلفية الجهاز:
                <input type="file" id="bgInput" accept="image/*">
            </label>

            <button onclick="toggleModal(false)" style="background: #f38ba8; color: #11111b; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 5px;">إغلاق</button>
        </div>
    </div>

    <!-- الساعة -->
    <div id="clock" class="focusable clock-top-center">00:00:00</div>

    <!-- شريط البحث -->
    <div class="search-container search-center" id="searchContainer">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" class="search-input" id="searchInput" placeholder="ابحث في Google..." autocomplete="off">
        </div>
        <div class="suggestions" id="suggestionsBox"></div>
    </div>

    <!-- المواقع المفضلة -->
    <div class="bookmarks focusable bm-bottom" id="bookmarksContainer"></div>

    <script>
        function toggleModal(show) {
            const modal = document.getElementById('settingsModal');
            if (show) modal.classList.add('active');
            else modal.classList.remove('active');
        }

        // --- 1. التركيز على البحث (Focus Mode) ---
        const searchInput = document.getElementById('searchInput');
        const searchContainer = document.getElementById('searchContainer');

        searchInput.addEventListener('focus', () => {
            document.body.classList.add('focus-mode');
        });

        searchInput.addEventListener('blur', () => {
            // تأخير بسيط للسماح بالنقر على الاقتراحات
            setTimeout(() => {
                document.body.classList.remove('focus-mode');
                searchContainer.classList.remove('active');
            }, 200);
        });

        // --- 2. محرك التنسيق المخصص للوقت والتاريخ ---
        function formatDateTime(date, formatStr) {
            const daysArr = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            
            const hours24 = date.getHours();
            const hours12 = hours24 % 12 || 12;
            const minutes = date.getMinutes();
            const seconds = date.getSeconds();
            const ampm = hours24 >= 12 ? 'PM' : 'AM';

            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const dayName = daysArr[date.getDay()];

            const pad = (num) => String(num).padStart(2, '0');

            return formatStr
                .replace(/YYYY/g, year)
                .replace(/MM/g, pad(month))
                .replace(/DD/g, pad(day))
                .replace(/dddd/g, dayName)
                .replace(/HH/g, pad(hours24))
                .replace(/hh/g, pad(hours12))
                .replace(/mm/g, pad(minutes))
                .replace(/ss/g, pad(seconds))
                .replace(/A/g, ampm);
        }

        function updateClock() {
            const now = new Date();
            const customFormat = localStorage.getItem('timeCustomFormatStr') || 'HH:mm:ss';
            document.getElementById('clock').innerText = formatDateTime(now, customFormat);
        }
        setInterval(updateClock, 1000);
        updateClock();

        const timeFormatInput = document.getElementById('timeFormatInput');
        timeFormatInput.value = localStorage.getItem('timeCustomFormatStr') || 'HH:mm:ss';
        timeFormatInput.addEventListener('input', (e) => {
            const val = e.target.value || 'HH:mm:ss';
            localStorage.setItem('timeCustomFormatStr', val);
            updateClock();
        });

        // --- 3. التحكم بالمواقع والخيارات ---
        const clockEl = document.getElementById('clock');
        const bmEl = document.getElementById('bookmarksContainer');

        document.getElementById('clockPosSelect').addEventListener('change', (e) => {
            clockEl.className = 'focusable ' + e.target.value;
            localStorage.setItem('clockPos', e.target.value);
        });

        document.getElementById('searchPosSelect').addEventListener('change', (e) => {
            searchContainer.className = 'search-container ' + e.target.value;
            localStorage.setItem('searchPos', e.target.value);
        });

        document.getElementById('bmPosSelect').addEventListener('change', (e) => {
            bmEl.className = 'bookmarks focusable ' + e.target.value;
            localStorage.setItem('bmPos', e.target.value);
        });

        // استعادة الخيارات
        const savedClockPos = localStorage.getItem('clockPos') || 'clock-top-center';
        const savedSearchPos = localStorage.getItem('searchPos') || 'search-center';
        const savedBmPos = localStorage.getItem('bmPos') || 'bm-bottom';

        clockEl.className = 'focusable ' + savedClockPos;
        searchContainer.className = 'search-container ' + savedSearchPos;
        bmEl.className = 'bookmarks focusable ' + savedBmPos;

        document.getElementById('clockPosSelect').value = savedClockPos;
        document.getElementById('searchPosSelect').value = savedSearchPos;
        document.getElementById('bmPosSelect').value = savedBmPos;

        // --- 4. الخلفية ---
        document.getElementById('bgInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const bgUrl = event.target.result;
                    document.body.style.backgroundImage = `url('${bgUrl}')`;
                    localStorage.setItem('customBg', bgUrl);
                };
                reader.readAsDataURL(file);
            }
        });
        const savedBg = localStorage.getItem('customBg');
        if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;

        // --- 5. الاقتراحات الحية (JSONP) ---
        const suggestionsBox = document.getElementById('suggestionsBox');

        window.handleGoogleSuggestions = function(data) {
            const suggestions = data[1];
            if (suggestions && suggestions.length > 0) {
                suggestionsBox.innerHTML = suggestions.slice(0, 5).map(item => `
                    <div class="suggestion-item" onclick="submitSearch('${item[0]}')">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <span>${item[0]}</span>
                    </div>
                `).join('');
                searchContainer.classList.add('active');
            } else {
                searchContainer.classList.remove('active');
            }
        };

        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            if (!query) {
                searchContainer.classList.remove('active');
                return;
            }
            const oldScript = document.getElementById('jsonp-suggestions');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonp-suggestions';
            script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=handleGoogleSuggestions`;
            document.body.appendChild(script);
        });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') submitSearch(this.value);
        });

        function submitSearch(query) {
            if (query) window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        }

        // --- 6. إدارة المفضلة ---
        function getBookmarks() {
            return JSON.parse(localStorage.getItem('bookmarks') || '[{"name":"YouTube","url":"https://youtube.com"},{"name":"GitHub","url":"https://github.com"}]');
        }

        function renderBookmarks() {
            const list = getBookmarks();
            let html = list.map((item, index) => {
                const domain = new URL(item.url).hostname;
                const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
                return `
                    <div class="bm-card">
                        <div class="bm-delete" onclick="deleteBookmark(${index})">✕</div>
                        <a href="${item.url}" class="bm-icon">
                            <img src="${iconUrl}" alt="${item.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>'">
                        </a>
                        <span class="bm-title">${item.name}</span>
                    </div>
                `;
            }).join('');

            html += `
                <div class="bm-card add-bm-btn" onclick="addNewBookmark()">
                    <div class="bm-icon">+</div>
                    <span class="bm-title">إضافة موقع</span>
                </div>
            `;
            bmEl.innerHTML = html;
        }

        function addNewBookmark() {
            const url = prompt('أدخل رابط الموقع (مثل https://google.com):');
            if (url) {
                let formattedUrl = url.startsWith('http') ? url : 'https://' + url;
                try {
                    const name = prompt('أدخل اسم الموقع:') || new URL(formattedUrl).hostname;
                    const list = getBookmarks();
                    list.push({ name, url: formattedUrl });
                    localStorage.setItem('bookmarks', JSON.stringify(list));
                    renderBookmarks();
                } catch(e) {
                    alert('رابط غير صالح!');
                }
            }
        }

        function deleteBookmark(index) {
            const list = getBookmarks();
            list.splice(index, 1);
            localStorage.setItem('bookmarks', JSON.stringify(list));
            renderBookmarks();
        }

        renderBookmarks();
    </script>
</body>
</html>
